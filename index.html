<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Templar's Vigil — Sir Aldren</title>
    <meta
      name="description"
      content="An immersive conversation with Sir Aldren, a 12th-century Templar knight."
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
<body>
  <!-- ======================================================
     PANTALLA DE ENTRADA
======================================================= -->

<div id="entry-screen" class="entry-screen">
  <div class="entry-content">

    <img
      src="images/ui/logo.png"
      alt="Order of Steel"
      class="entry-logo"
    >

    <h1 class="entry-title">
      ORDER OF STEEL
    </h1>

    <p class="entry-subtitle">
      A medieval AI experience
    </p>

    <button
      id="enter-button"
      class="enter-button"
      type="button"
    >
      ENTER THE ORDER
    </button>

    <p class="entry-sound">
      Best experienced with sound
    </p>

  </div>
</div>
  <div
  id="sceneLoader"
  class="scene-loader"
  aria-hidden="true"
  style="display: none;"
>
    <div class="scene-loader-content">
      <img
        src="images/escudo.png"
        alt=""
        class="scene-loader-crest"
      />

      <p class="scene-loader-title">ORDER OF STEEL</p>
      <p class="scene-loader-text">Preparando el camino...</p>
    </div>
  </div>

  <div class="scene" aria-hidden="true">
    <div id="sceneImage" class="scene-image"></div>

    <video
      id="sceneVideo"
      class="scene-video"
      muted
      autoplay
      loop
      playsinline
      preload="auto"
    ></video>
  </div>
<header class="top-bar">

  <div class="brand">

    <img
      src="images/ui/logo.png"
      alt="Order of Steel"
      class="top-logo"
    >

  </div>

 <div class="top-actions">
  <div class="languages">

    <p class="lang-title">
      Disponible en más de 100 idiomas
    </p>

   <div class="flags">

  <img
    src="images/ui/flags.png"
    alt="Idiomas soportados"
    class="languages-flags"
  >

</div>

    <p class="lang-subtitle">
      Available in over 100 languages
    </p>

  </div>
</div>

</header>
  <div class="vignette" aria-hidden="true"></div>

  <section
  class="dialogue-panel"
  id="dialogue-panel"
  aria-label="Dialogue with Sir Aldren"
>

  <!-- BLOQUE DE VOZ INDEPENDIENTE -->
<div class="voice-panel">

  <button
    id="voiceBtn"
    class="voice-btn"
    type="button"
    aria-label="Hablar con Sir Aldren"
  >
    <img
      src="images/ui/mic-button_lines.png"
      alt=""
      class="voice-lines"
    >

    <img
      src="images/ui/mic-button.png"
      alt=""
      class="voice-mic"
    >
  </button>

 <div class="voice-wave" aria-hidden="true">
  <svg
    class="voice-wave-svg"
    viewBox="0 0 220 30"
    preserveAspectRatio="none"
  >
    <path
      class="voice-wave-path voice-wave-path-1"
      d="M0 15
         C10 15, 10 5, 20 5
         S30 25, 40 25
         S50 5, 60 5
         S70 25, 80 25
         S90 5, 100 5
         S110 25, 120 25
         S130 5, 140 5
         S150 25, 160 25
         S170 5, 180 5
         S190 25, 200 25
         S210 15, 220 15"
    />

    <path
      class="voice-wave-path voice-wave-path-2"
      d="M-220 15
         C-210 15, -210 5, -200 5
         S-190 25, -180 25
         S-170 5, -160 5
         S-150 25, -140 25
         S-130 5, -120 5
         S-110 25, -100 25
         S-90 5, -80 5
         S-70 25, -60 25
         S-50 5, -40 5
         S-30 25, -20 25
         S-10 15, 0 15"
    />
  </svg>
</div>

  <div class="voice-text">

    <div class="voice-title">
      Habla con Sir Aldren o escribe tu mensaje
    </div>

    <div class="voice-subtitle">
      Speak to Sir Aldren or write your message
    </div>

  </div>

</div>

  <!-- PANEL DE DIÁLOGO -->
  <div class="panel-inner">

    <img
      src="images/ui/cornertopiz.png"
      class="panel-corner panel-corner-left"
      alt=""
    >

    <img
      src="images/ui/cornertopde.png"
      class="panel-corner panel-corner-right"
      alt=""
    >

    <div class="header-row">

      <img
        src="images/escudo.png"
        alt="Templar crest"
        class="crest"
        id="crest"
      />

      <h1
        class="knight-name"
        id="knight-name"
      >
        Sir Aldren
      </h1>

    </div>

    <p
      class="knight-response"
      id="knight-response"
    ></p>

    <p
      class="status"
      id="status"
      role="status"
      aria-live="polite"
    ></p>

    <div class="input-row">

      <input
        type="text"
        class="player-input"
        id="player-input"
        placeholder="Habla con el templario..."
        autocomplete="off"
        aria-label="Tu mensaje al templario"
      />

      <button
        class="send-btn"
        id="send-btn"
        type="button"
      >
        Enviar
      </button>

    </div>

  </div>

</section>

  <audio
    id="backgroundMusic"
    src="./audio/order-of-steel-theme.mp3"
    loop
    preload="auto"
  ></audio>

  <script
    type="module"
    src="app.js"
  ></script>
</body>
</html>
